services:
    radio-normalize:
        container_name: "votv-radio-normalize"
        build:
            context: .
        #platform: "linux/amd64"
        entrypoint: sh
        command:
            - -c
            - >
              find /tmp/radio -type f -regextype posix-extended -regex ".*\.(mp3|m4a)" | parallel -j 8 ffmpeg-normalize "{}" -v -ar 44100 -of /tmp/normalized/radio -c:a libmp3lame -ext mp3 --keep-loudness-range-target --auto-lower-loudness-target
        volumes:
            - ./normalized:/tmp/normalized
            - ./radio:/tmp/radio
